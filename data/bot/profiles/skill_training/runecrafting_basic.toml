name = "runecrafting_basic"
description = "Basic runecrafting training for F2P players"
category = "skill_training"
weight = 6
required_flags = ["rune_mysteries_complete"]

[step.acquire_essences]
description = "Get rune essence for runecrafting"
requirements = ["has_flag(rune_mysteries_complete)", "quest_completed(rune_mysteries)"]
completion_criteria = ["inventory_has(rune_essence, 100)", "inventory_has(air_talisman)"]
award_flags = ["runecrafting_ready"]
fallback_category = "coin_gathering"

[step.craft_runes]
description = "Craft air runes at air altar"
requirements = ["has_flag(runecrafting_ready)", "inventory_has(rune_essence, 50)", "inventory_has(air_talisman)"]
completion_criteria = ["skill_level(runecrafting, 10)", "inventory_has(air_rune, 500)"]
award_flags = ["basic_runecrafting"]
fallback_category = "coin_gathering"
