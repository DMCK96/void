name = "quest_runner"
description = "Profile for completing quests efficiently"
category = "questing"
weight = 15
required_flags = ["dialogue_system_mastered", "inventory_management"]

[step.quest_preparation]
description = "Prepare for quest requirements"
requirements = ["total_level(100)", "inventory_space(10)"]
completion_criteria = ["inventory_has(food, 10)", "coins(1000)", "skill_level(attack, 20)"]
award_flags = ["quest_prepared"]
fallback_category = "skilling"

[step.quest_execution]
description = "Execute quest objectives"
requirements = ["has_flag(quest_prepared)"]
completion_criteria = ["quest_completed(cooks_assistant)", "quest_completed(sheep_shearer)", "quest_completed(romeo_and_juliet)"]
award_flags = ["quest_success"]
fallback_category = "skilling"
